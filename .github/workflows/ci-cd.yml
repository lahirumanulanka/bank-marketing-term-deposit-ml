name: Model CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  validate-model:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Validate model files
      run: |
        python -c "
        import pickle
        import os
        
        # Check if model files exist
        required_files = [
            'models/lightgbm_retrained_tuned.pkl',
            'models/preprocessing/scaler.pkl',
            'models/preprocessing/label_encoders.pkl'
        ]
        
        for file in required_files:
            if not os.path.exists(file):
                raise FileNotFoundError(f'Required file not found: {file}')
            print(f'✓ Found: {file}')
        
        # Load and validate model
        with open('models/lightgbm_retrained_tuned.pkl', 'rb') as f:
            model = pickle.load(f)
            print(f'✓ Model loaded successfully')
        
        # Validate preprocessors
        with open('models/preprocessing/scaler.pkl', 'rb') as f:
            scaler = pickle.load(f)
            print(f'✓ Scaler loaded successfully')
        
        with open('models/preprocessing/label_encoders.pkl', 'rb') as f:
            encoders = pickle.load(f)
            print(f'✓ Encoders loaded successfully')
        
        print('All validations passed!')
        "
    
    - name: Test API endpoints
      run: |
        cd deployment
        python -c "
        # Basic import test
        import sys
        sys.path.insert(0, '.')
        from api import app
        print('✓ API imports successfully')
        "

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8
    
    - name: Run black
      run: black --check huggingface_space/ deployment/ || true
    
    - name: Run isort
      run: isort --check-only huggingface_space/ deployment/ || true
    
    - name: Run flake8
      run: flake8 huggingface_space/ deployment/ --max-line-length=120 || true
